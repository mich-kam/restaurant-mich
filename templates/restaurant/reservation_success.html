{% extends 'restaurant/base.html' %}
{% load static %}

{% block content %}
<!-- Success Section -->
<section class="success-section" style="padding: 120px 0 80px;">
    <div class="container">
        <div class="success-content text-center">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Reservation Submitted Successfully!</h2>
            <p>Thank you for choosing {{ settings.site_name }}. We have received your reservation request and will contact you soon to confirm your booking.</p>
            <div class="success-actions">
                <button class="btn-primary" onclick="location.href='{% url 'restaurant:home' %}'">Back to Home</button>
                <button class="btn-secondary" onclick="location.href='{% url 'restaurant:menu' %}'">View Menu</button>
            </div>
        </div>
    </div>
</section>

<style>
.success-section {
    background: linear-gradient(135deg, #fff5f0 0%, #fff 100%);
    min-height: 60vh;
    display: flex;
    align-items: center;
}

.success-content {
    background: white;
    padding: 3rem;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    max-width: 600px;
    margin: 0 auto;
}

.success-icon {
    font-size: 4rem;
    color: #28a745;
    margin-bottom: 1.5rem;
}

.success-content h2 {
    color: #333;
    margin-bottom: 1rem;
}

.success-content p {
    color: #666;
    font-size: 1.1rem;
    margin-bottom: 2rem;
}

.success-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}
</style>
{% endblock %}
