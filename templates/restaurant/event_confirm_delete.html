<!DOCTYPE html>
<html>
<head>
    <title>Supprimer un événement</title>
</head>
<body>
    <h1>Supprimer "{{ event.title }}" ?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmer la suppression</button>
        <a href="{% url 'event_list' %}">Annuler</a>
    </form>
</body>
</html>
